action.RiderIlSpy.SaveAsProjectAction.text=Save Decompiled Assembly as Project...
action.RiderIlSpy.SaveAsProjectAction.description=Decompile this managed .dll or .exe to a buildable C# project tree using ILSpy.
action.save_as_project.chooser.title=Choose Output Directory
action.save_as_project.chooser.description=ILSpy will write a .csproj and source files into this folder.
action.save_as_project.progress.title=Decompiling {0} to project
