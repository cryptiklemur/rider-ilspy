search.toolwindow.status.results_searching={0} results in {1} assemblies... still searching
search.toolwindow.status.indexing=indexing {0}/{1}
search.toolwindow.status.indexing_failed=indexing failed: {0}
search.toolwindow.status.idle=idle
search.toolwindow.status.indexed={0} indexed
search.toolwindow.status.indexed_skipped={0} indexed · {1} skipped

# ---- search everywhere contributor ----
search.everywhere.group_name=ILSpy Literals

# ---- rescan action ----
# IntelliJ resolves `action.<id>.text` / `.description` automatically once
# the action's text/description attrs are removed from plugin.xml.
action.ILSpy.RescanAll.text=Rescan ILSpy Search Index
action.ILSpy.RescanAll.description=Rebuild the ILSpy search index for the open solution
action.rescan.notification.title=ILSpy Search
action.rescan.notification.message=Rescan All is not yet wired — use rescanAssembly per-assembly via the context menu. (Full rescan will require a protocol revision.)

