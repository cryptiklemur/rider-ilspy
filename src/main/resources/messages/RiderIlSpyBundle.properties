search.options.max_results=Max results per query:
search.options.excluded_assemblies=Excluded assemblies:
search.options.excluded_assemblies.comment=Add assembly file names (one per line) in the global settings file.

# ---- search tool window ----
# IntelliJ auto-resolves `toolwindow.stripe.<id>` to the stripe label for the
# toolWindow registered in plugin.xml. The bundle's `<resource-bundle>` is the
# lookup source — no explicit key= attribute on <toolWindow> is needed.
toolwindow.stripe.ILSpySearch=ILSpy Search
search.toolwindow.empty_text=no results yet
search.toolwindow.regex=regex
search.toolwindow.case_sensitive=case-sensitive
search.toolwindow.whole_word=whole word
search.toolwindow.search_button=Search
search.toolwindow.query_type.literal=Literal
search.toolwindow.query_type.attribute=Attribute
search.toolwindow.query_type.token=Token
search.toolwindow.query_type.constant=Constant
search.toolwindow.query_type.resource=Resource
