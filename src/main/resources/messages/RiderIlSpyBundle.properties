# RiderIlSpy user-facing strings.
#
# Keys follow `<surface>.<context>.<role>` and are dot-separated.
# All values are English baseline; per-locale overlays live in
# RiderIlSpyBundle_<lang>.properties (none yet — translatable infra
# only as of this commit).
#
# Referenced from Kotlin via `RiderIlSpyBundle.message("key", *args)`
# (annotated with @PropertyKey so the IDE flags missing keys).
# Referenced from plugin.xml via `key="..."` on actions / configurables
# (plugin.xml's <resource-bundle> resolves them).

# ---- plugin meta ----
plugin.name=ILSpy Integration

# ---- status bar widget ----
statusbar.mode.display_name=ILSpy Mode
statusbar.mode.tooltip=ILSpy decompiler output mode. Click to switch — affects subsequent decompiles.
statusbar.mode.popup_title=ILSpy Mode
statusbar.mode.label_base=ILSpy: {0}
statusbar.mode.label_indexing={0} · indexing {1}/{2}
statusbar.mode.label_failed={0} · index failed
statusbar.mode.label_off=ILSpy: Off
statusbar.mode.popup.off=Off (disable ILSpy)
statusbar.mode.popup.current_suffix=  (current)

# ---- ilspy mode names ----
mode.csharp.display=C#
mode.il.display=IL
mode.csharp_with_il.display=C# + IL

# ---- options pages ----
options.page.decompiler.name=ILSpy Decompiler
options.page.search.name=Search

# ---- search options panel ----
search.options.group.title=Search
search.options.enable_indexer=Enable background indexer
